name: Verify signed catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalog, signatures, and immutable manifests
        run: python3 scripts/catalog_tool.py verify --online
